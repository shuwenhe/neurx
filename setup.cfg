[metadata]
name = tensor
version = 0.2.0
description = Tensor deep learning platform foundation

[options]
packages = find:
package_dir =
    = python
install_requires =
    numpy
python_requires = >=3.10

[options.extras_require]
dev =
    pytest
    ruff

[options.entry_points]
console_scripts =
    tensor-doctor = tensor.cli:main

[options.packages.find]
include =
    tensor
    tensor.*
