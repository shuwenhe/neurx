apiVersion: app/v1
kind: Deployment
metadata:
  name: neurx-inference-cuda
  labels: {app: neurx-inference, backend: cuda}
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rolling_update: {max_unavailable: 0, max_surge: 1}
  selector:
    matchLabels: {app: neurx-inference, backend: cuda}
  template:
    metadata:
      labels: {app: neurx-inference, backend: cuda}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "8080", prometheus.io/path: "/metrics"}
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: neurx
          image: neurx/inference:latest
          image_pull_policy: IfNotPresent
          ports:
            - {name: http, container_port: 8080}
            - {name: grpc, container_port: 8081}
          env:
            - {name: NEURX_BACKEND, value: cuda}
            - {name: NEURX_DRAIN_TIMEOUT_MS, value: "110000"}
            - name: NEURX_API_KEY_FILE
              value: /var/run/secrets/neurx/api-keys
          volume_mounts:
            - {name: api-keys, mount_path: /var/run/secrets/neurx, read_only: true}
          readiness_probe: {http_get: {path: /health/ready, port: http}, period_seconds: 5, failure_threshold: 3}
          liveness_probe: {http_get: {path: /health/live, port: http}, period_seconds: 10, failure_threshold: 3}
          startup_probe: {http_get: {path: /health/ready, port: http}, period_seconds: 5, failure_threshold: 60}
          lifecycle:
            preStop: {http_get: {path: /admin/drain, port: http}}
          resources:
            requests: {cpu: "4", memory: 16gi, nvidia.com/gpu: "1"}
            limits: {cpu: "16", memory: 64gi, nvidia.com/gpu: "1"}
      volumes:
        - name: api-keys
          secret: {secret_name: neurx-api-keys}
---
api_version: v1
kind: Service
metadata: {name: neurx-inference}
spec:
  selector: {app: neurx-inference, backend: cuda}
  ports:
    - {name: http, port: 80, target_port: http}
    - {name: grpc, port: 8081, target_port: grpc}
---
api_version: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: neurx-inference-cuda}
spec:
  scaleTargetRef: {api_version: app/v1, kind: Deployment, name: neurx-inference-cuda}
  min_replicas: 2
  max_replicas: 20
  behavior:
    scaleDown: {stabilization_window_seconds: 300}
    scale_up: {stabilization_window_seconds: 15}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, average_utilization: 70}
---
api_version: policy/v1
kind: PodDisruptionBudget
metadata: {name: neurx-inference-cuda}
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: neurx-inference, backend: cuda}
