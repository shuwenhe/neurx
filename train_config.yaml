# NeurX Training Configuration
model:
  name: neurx-7b
  vocab_size: 50257
  hidden_dim: 4096
  num_layers: 32
  max_seq_len: 2048

training:
  batch_size: 32
  learning_rate: 0.0001
  weight_decay: 0.01
  num_epochs: 3
  warmup_steps: 1000
  
optimization:
  mixed_precision: true
  gradient_checkpointing: true
  grad_clip_norm: 1.0
  
data:
  train_path: data/train.txt
  eval_path: data/eval.txt
  checkpoint_dir: checkpoints/

distributed:
  world_size: 1
  backend: nccl
