


[agent]
name = "neurx-agent"
model = "neurx-reference-model"
reasoning = "disabled"
max_retries = 3
execution_timeout_ms = 300000
max_output_size = 1000000
verbose_logging = false
strict_mode = false
auto_approve = false

enable_shell_execution = true
enable_file_operations = true
enable_network_access = false

[llm]
provider = "remote"
api_key = "${NEURX_API_KEY}"
model = "neurx-reference-model"

max_tokens = 8000
temperature = 0.7
top_p = 1.0

max_retries = 3
retry_delay_ms = 1000
timeout_ms = 60000




[storage]
backend = "file-based"
data_dir = "~/.neurx/data"

[storage.file_paths]
threads_dir = "threads"
checkpoints_dir = "checkpoints"
logs_dir = "logs"









[approval]
mode = "on-request"
reviewer = "user"
auto_approve_on_retry = false
auto_approve_read_only = true

[[approval.trusted_paths]]
path = "/tmp"

[[approval.trusted_paths]]
path = "~/.config"

[[approval.blocked_paths]]
path = "/etc/passwd"

[[approval.blocked_paths]]
path = "/root/.ssh"

[approval.tool_policies]
git = "on-request"
shell = "on-request"
file-system = "granular"
network = "never"

[logging]
level = "info"
format = "text"
output = "console"
log_file = "neurx.log"
max_file_size_mb = 100
max_backups = 10
color_output = true

enable_telemetry = false




[tools.shell]
enabled = true
timeout_ms = 30000

[tools.shell.settings]
working_directory = "~"
env_inherit = true

[tools.shell.sandbox]
mode = "read-only"
allowed_paths = ["/tmp", "${HOME}"]
blocked_paths = ["/etc", "/root"]

[tools.file-system]
enabled = true
timeout_ms = 10000

[tools.file-system.sandbox]
mode = "workspace-write"
allowed_paths = ["${HOME}/workspace"]
blocked_paths = ["/root", "/sys"]

[tools.git]
enabled = true
timeout_ms = 30000

[tools.git.permissions]
permissions = ["clone", "pull", "push", "commit"]

[tools.network]
enabled = false
timeout_ms = 60000



[custom]

enable_custom_plugins = true
plugin_directory = "~/.neurx/plugins"
