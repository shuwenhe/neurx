name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install repository checks
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Check repository layout and domain boundaries
        env:
          NEURX_ARCH_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: make check-architecture
      - name: Check benchmark result contract
        run: make test-benchmark-schema

  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell scripts
        run: bash -n scripts/*.sh scripts/legacy/*.sh
