name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build (${ { matrix.os } })
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build --config Release --parallel

      - name: Package (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p artifacts
          tar -czf neurx-${{ github.ref_name }}-${{ matrix.os }}.tar.gz build || true
          mv neurx-${{ github.ref_name }}-${{ matrix.os }}.tar.gz artifacts/

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          New-Item -ItemType Directory artifacts -Force
          Compress-Archive -Path build\* -DestinationPath neurx-${{ github.ref_name }}-windows.zip
          Move-Item neurx-${{ github.ref_name }}-windows.zip artifacts\

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: neurx-${{ github.ref_name }}-${{ matrix.os }}
          path: artifacts/*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: ${{ github.ref_name }}
          body: "Automated release from CI"
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          for f in artifacts/*; do
            echo "Uploading $f"
            curl -s -X POST \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$f" "${{ steps.create_release.outputs.upload_url }}?name=$(basename $f)"
          done
