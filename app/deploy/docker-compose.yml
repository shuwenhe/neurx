services:
  backend:
    build:
      context: ../..
      dockerfile: app/web/backend/Dockerfile
    environment:
      PORT: 18080
    volumes:
      - /home/shuwen/.local/bin/s:/usr/local/bin/s:ro
    ports:
      - "18080:18080"

  frontend:
    build:
      context: ../..
      dockerfile: app/web/frontend/Dockerfile
    environment:
      NEURX_BACKEND_URL: http://backend:18080/neurx/api/chat
    depends_on:
      - backend
    ports:
      - "3000:3000"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - frontend
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.neurx.compose.conf:/etc/nginx/conf.d/default.conf:ro
