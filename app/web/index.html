<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeurX - AI推理引擎</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #10a37f;
      --primary-dark: #0d8659;
      --bg-primary: #1a1a1a;
      --bg-secondary: #212121;
      --bg-tertiary: #2a2a2a;
      --text-primary: #ffffff;
      --text-secondary: #b0b0b0;
      --border-color: #404040;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      height: 100vh;
      overflow: hidden;
    }

    .app-container {
      display: flex;
      height: 100%;
    }

    /* 侧边栏 */
    .sidebar {
      width: 260px;
      background: var(--bg-secondary);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 16px;
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: var(--bg-tertiary);
      border-radius: 8px;
      margin-bottom: 16px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .sidebar-header:hover {
      background: var(--border-color);
    }

    .new-chat-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 12px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-primary);
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s;
      margin-bottom: 16px;
    }

    .new-chat-btn:hover {
      background: var(--border-color);
    }

    .chat-history {
      flex: 1;
      overflow-y: auto;
    }

    .chat-history::-webkit-scrollbar {
      width: 8px;
    }

    .chat-history::-webkit-scrollbar-track {
      background: transparent;
    }

    .chat-history::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 4px;
    }

    .chat-item {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 8px;
      cursor: pointer;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 14px;
      transition: all 0.2s;
      border: 1px solid transparent;
    }

    .chat-item:hover {
      background: var(--bg-tertiary);
      color: var(--text-primary);
    }

    .chat-item.active {
      background: var(--bg-tertiary);
      color: var(--text-primary);
      border-color: var(--primary);
    }

    .sidebar-footer {
      border-top: 1px solid var(--border-color);
      padding-top: 16px;
      padding-bottom: 0;
    }

    .sidebar-footer-item {
      padding: 12px;
      color: var(--text-secondary);
      cursor: pointer;
      border-radius: 8px;
      font-size: 14px;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .sidebar-footer-item:hover {
      color: var(--text-primary);
      background: var(--bg-tertiary);
    }

    /* 主聊天区域 */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg-primary);
    }

    .chat-header {
      border-bottom: 1px solid var(--border-color);
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat-header-title {
      font-size: 14px;
      color: var(--text-secondary);
    }

    .header-info {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 4px 12px;
      background: var(--bg-secondary);
      border-radius: 6px;
      font-size: 12px;
    }

    .status-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--primary);
    }

    .status-indicator.offline {
      background: #ef4444;
    }

    .status-indicator.loading {
      background: #f59e0b;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* 聊天消息区域 */
    .messages-container {
      flex: 1;
      overflow-y: auto;
      padding: 24px 32px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .messages-container::-webkit-scrollbar {
      width: 8px;
    }

    .messages-container::-webkit-scrollbar-track {
      background: transparent;
    }

    .messages-container::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 4px;
    }

    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      color: var(--text-secondary);
    }

    .empty-state-icon {
      font-size: 48px;
      opacity: 0.3;
    }

    .empty-state-title {
      font-size: 24px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .empty-state-subtitle {
      font-size: 14px;
      opacity: 0.7;
    }

    /* 消息样式 */
    .message {
      display: flex;
      gap: 12px;
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message-avatar {
      width: 32px;
      height: 32px;
      border-radius: 4px;
      background: var(--bg-tertiary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .message.user {
      justify-content: flex-end;
    }

    .message.user .message-avatar {
      background: var(--primary);
      order: 2;
    }

    .message.user .message-content {
      order: 1;
    }

    .message-content {
      max-width: 70%;
      background: var(--bg-secondary);
      border-radius: 12px;
      padding: 12px 16px;
      line-height: 1.5;
      font-size: 15px;
      word-wrap: break-word;
    }

    .message.user .message-content {
      background: var(--primary);
      color: white;
    }

    .message.error .message-content {
      background: #7f1d1d;
      border-left: 3px solid #ef4444;
      padding-left: 13px;
    }

    .message.loading .message-content {
      background: transparent;
      padding: 0;
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .typing-indicator span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-secondary);
      animation: bounce 1.4s infinite;
    }

    .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
    .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); opacity: 0.5; }
      40% { transform: scale(1); opacity: 1; }
    }

    /* 输入区域 */
    .input-area {
      border-top: 1px solid var(--border-color);
      padding: 24px 32px;
      background: var(--bg-primary);
    }

    .input-wrapper {
      display: flex;
      gap: 12px;
      align-items: flex-end;
      max-width: 900px;
      margin: 0 auto;
      width: 100%;
    }

    .input-field-container {
      flex: 1;
      display: flex;
      gap: 8px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 12px 16px;
      transition: border-color 0.2s;
    }

    .input-field-container:focus-within {
      border-color: var(--primary);
    }

    #messageInput {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-primary);
      font-size: 15px;
      outline: none;
      resize: none;
      max-height: 100px;
      font-family: inherit;
    }

    #messageInput::placeholder {
      color: var(--text-secondary);
    }

    .input-actions {
      display: flex;
      gap: 4px;
    }

    .icon-btn {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: transparent;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      transition: all 0.2s;
    }

    .icon-btn:hover {
      background: var(--bg-tertiary);
      color: var(--text-primary);
    }

    .send-btn {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      background: var(--primary);
      border: none;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      transition: all 0.2s;
    }

    .send-btn:hover:not(:disabled) {
      background: var(--primary-dark);
      transform: scale(1.05);
    }

    .send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* 参数面板 */
    .params-panel {
      position: fixed;
      right: 0;
      top: 0;
      width: 300px;
      height: 100%;
      background: var(--bg-secondary);
      border-left: 1px solid var(--border-color);
      padding: 20px;
      overflow-y: auto;
      transform: translateX(100%);
      transition: transform 0.3s;
      z-index: 1000;
    }

    .params-panel.open {
      transform: translateX(0);
    }

    .params-close {
      background: none;
      border: none;
      color: var(--text-primary);
      cursor: pointer;
      font-size: 24px;
      margin-bottom: 16px;
    }

    .param-group {
      margin-bottom: 20px;
    }

    .param-label {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .param-value {
      font-size: 13px;
      color: var(--text-primary);
      font-weight: 500;
      margin-bottom: 8px;
    }

    input[type="range"] {
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: var(--bg-tertiary);
      outline: none;
      -webkit-appearance: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--primary);
      cursor: pointer;
    }

    input[type="range"]::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--primary);
      cursor: pointer;
      border: none;
    }

    select {
      width: 100%;
      padding: 8px;
      background: var(--bg-tertiary);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      margin-bottom: 12px;
    }

    /* 响应式 */
    @media (max-width: 768px) {
      .sidebar {
        display: none;
      }

      .message-content {
        max-width: 90%;
      }

      .messages-container {
        padding: 16px;
      }

      .input-area {
        padding: 16px;
      }

      .params-panel {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- 侧边栏 -->
    <div class="sidebar">
      <button class="new-chat-btn" onclick="app.newChat()">
        <span>➕</span>
        <span>新对话</span>
      </button>

      <div class="chat-history" id="chatHistory"></div>

      <div class="sidebar-footer">
        <div class="sidebar-footer-item" onclick="app.toggleParams()">
          <span>⚙️</span>
          <span>参数设置</span>
        </div>
        <div class="sidebar-footer-item" onclick="app.clearChat()">
          <span>🗑️</span>
          <span>清空聊天</span>
        </div>
      </div>
    </div>

    <!-- 主聊天区域 -->
    <div class="main-content">
      <div class="chat-header">
        <div class="chat-header-title">NeurX AI推理引擎</div>
        <div class="header-info">
          <div class="status-indicator" id="statusIndicator"></div>
          <span id="statusText">检查连接...</span>
        </div>
      </div>

      <div class="messages-container" id="messagesContainer">
        <div class="empty-state">
          <div class="empty-state-icon">🤖</div>
          <div class="empty-state-title">NeurX AI助手</div>
          <div class="empty-state-subtitle">高性能LLM推理引擎 · 实时对话</div>
        </div>
      </div>

      <div class="input-area">
        <div class="input-wrapper">
          <div class="input-field-container">
            <input
              type="text"
              id="messageInput"
              placeholder="输入消息或按 Shift + Enter 换行..."
              onkeydown="if(event.key==='Enter' && !event.shiftKey) { event.preventDefault(); app.sendMessage(); }"
            />
            <div class="input-actions">
              <button class="icon-btn" title="附件" onclick="alert('功能开发中')">📎</button>
            </div>
          </div>
          <button class="send-btn" id="sendBtn" onclick="app.sendMessage()" title="发送">➤</button>
        </div>
      </div>
    </div>

    <!-- 参数面板 -->
    <div class="params-panel" id="paramsPanel">
      <button class="params-close" onclick="app.toggleParams()">✕</button>

      <div class="param-group">
        <div class="param-label">模型</div>
        <select id="modelSelect" onchange="app.state.model = this.value">
          <option value="default">NeurX Default</option>
          <option value="gpu">GPU加速</option>
          <option value="cpu">CPU</option>
        </select>
      </div>

      <div class="param-group">
        <div class="param-label">温度 (Temperature)</div>
        <div class="param-value" id="tempValue">0.7</div>
        <input type="range" id="temperature" min="0" max="2" step="0.1" value="0.7"
          oninput="document.getElementById('tempValue').textContent = this.value; app.state.temperature = parseFloat(this.value);"
        />
        <div style="font-size: 12px; color: var(--text-secondary); margin-top: 8px;">控制回应的创意程度</div>
      </div>

      <div class="param-group">
        <div class="param-label">最大长度 (Max Tokens)</div>
        <div class="param-value" id="maxTokensValue">256</div>
        <input type="range" id="maxTokens" min="50" max="2048" step="50" value="256"
          oninput="document.getElementById('maxTokensValue').textContent = this.value; app.state.maxTokens = parseInt(this.value);"
        />
      </div>

      <div class="param-group">
        <div class="param-label">Top P</div>
        <div class="param-value" id="topPValue">0.9</div>
        <input type="range" id="topP" min="0" max="1" step="0.05" value="0.9"
          oninput="document.getElementById('topPValue').textContent = this.value; app.state.topP = parseFloat(this.value);"
        />
      </div>

      <div class="param-group">
        <div class="param-label">Top K</div>
        <div class="param-value" id="topKValue">40</div>
        <input type="range" id="topK" min="0" max="100" step="5" value="40"
          oninput="document.getElementById('topKValue').textContent = this.value; app.state.topK = parseInt(this.value);"
        />
      </div>
    </div>
  </div>

  <script>
    const API_BASE = window.location.hostname === 'localhost' ? 'http://localhost:8000' : '';

    window.app = {
      state: {
        messages: [],
        isLoading: false,
        backendStatus: 'checking',
        temperature: 0.7,
        maxTokens: 256,
        topP: 0.9,
        topK: 40,
        model: 'default'
      },

      async init() {
        this.checkBackendStatus();
        setInterval(() => this.checkBackendStatus(), 5000);
        this.render();
        document.getElementById('messageInput').focus();
      },

      async checkBackendStatus() {
        try {
          const response = await fetch(`${API_BASE}/health`, {
            method: 'GET',
            headers: { 'Content-Type': 'application/json' }
          });
          if (response.ok) {
            this.state.backendStatus = 'online';
          } else {
            this.state.backendStatus = 'error';
          }
        } catch (e) {
          this.state.backendStatus = 'offline';
        }
        this.updateStatus();
      },

      updateStatus() {
        const indicator = document.getElementById('statusIndicator');
        const text = document.getElementById('statusText');
        const status = this.state.backendStatus;

        indicator?.classList.remove('offline', 'loading');
        if (status === 'online') {
          text.textContent = '后端在线';
        } else if (status === 'offline') {
          indicator?.classList.add('offline');
          text.textContent = '后端离线';
        } else {
          indicator?.classList.add('loading');
          text.textContent = '检查连接...';
        }
      },

      async sendMessage() {
        const input = document.getElementById('messageInput');
        const message = input.value.trim();

        if (!message || this.state.isLoading) return;

        input.value = '';
        input.focus();

        this.state.messages.push({
          role: 'user',
          content: message
        });
        this.render();

        this.state.isLoading = true;
        this.state.messages.push({
          role: 'assistant',
          content: '...',
          loading: true
        });
        this.render();

        try {
          const response = await fetch(`${API_BASE}/v1/chat/completions`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              model: this.state.model,
              messages: this.state.messages.filter(m => m.role !== 'error' && !m.loading),
              max_tokens: this.state.maxTokens,
              temperature: this.state.temperature,
              top_p: this.state.topP,
              top_k: this.state.topK
            })
          });

          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const data = await response.json();
          const assistantMessage = data.choices?.[0]?.message?.content || '抱歉，未能获得回复';

          this.state.messages[this.state.messages.length - 1] = {
            role: 'assistant',
            content: assistantMessage
          };
        } catch (error) {
          this.state.messages[this.state.messages.length - 1] = {
            role: 'error',
            content: `❌ ${error.message || '发送失败，请检查后端连接'}`
          };
        } finally {
          this.state.isLoading = false;
          this.render();
        }
      },

      newChat() {
        if (confirm('要开始新对话吗？')) {
          this.state.messages = [];
          this.render();
        }
      },

      clearChat() {
        if (confirm('确定要清空所有聊天吗？')) {
          this.state.messages = [];
          this.render();
        }
      },

      toggleParams() {
        const panel = document.getElementById('paramsPanel');
        panel?.classList.toggle('open');
      },

      render() {
        const container = document.getElementById('messagesContainer');
        if (!container) return;

        if (this.state.messages.length === 0) {
          container.innerHTML = `
            <div class="empty-state">
              <div class="empty-state-icon">🤖</div>
              <div class="empty-state-title">NeurX AI助手</div>
              <div class="empty-state-subtitle">高性能LLM推理引擎 · 实时对话</div>
            </div>
          `;
        } else {
          container.innerHTML = this.state.messages.map(msg => {
            if (msg.loading) {
              return `
                <div class="message loading">
                  <div class="message-avatar">🤖</div>
                  <div class="message-content">
                    <div class="typing-indicator">
                      <span></span><span></span><span></span>
                    </div>
                  </div>
                </div>
              `;
            }
            return `
              <div class="message ${msg.role}">
                <div class="message-avatar">${msg.role === 'user' ? '👤' : msg.role === 'error' ? '❌' : '🤖'}</div>
                <div class="message-content">${msg.content}</div>
              </div>
            `;
          }).join('');

          container.scrollTop = container.scrollHeight;
        }

        const sendBtn = document.getElementById('sendBtn');
        const input = document.getElementById('messageInput');
        if (sendBtn) {
          sendBtn.disabled = this.state.isLoading || !input?.value.trim();
        }
      }
    };

    app.init();
  </script>
</body>
</html>
