<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeurX - AI推理引擎</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #10a37f;
      --primary-dark: #0d8659;
      --bg-primary: #1a1a1a;
      --bg-secondary: #212121;
      --bg-tertiary: #2a2a2a;
      --text-primary: #ffffff;
      --text-secondary: #b0b0b0;
      --border-color: #404040;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      height: 100vh;
      overflow: hidden;
    }

    .app-container {
      display: flex;
      height: 100%;
    }

    .sidebar {
      width: 260px;
      background: var(--bg-secondary);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 16px;
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: var(--bg-tertiary);
      border-radius: 8px;
      margin-bottom: 16px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .sidebar-header:hover {
      background: var(--border-color);
    }

    .new-chat-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 12px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-primary);
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s;
      margin-bottom: 16px;
    }

    .new-chat-btn:hover {
      background: var(--border-color);
    }

    .chat-history {
      flex: 1;
      overflow-y: auto;
    }

    .chat-item {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 8px;
      cursor: pointer;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 14px;
      transition: all 0.2s;
      border: 1px solid transparent;
    }

    .chat-item:hover {
      background: var(--bg-tertiary);
      color: var(--text-primary);
    }

    .chat-item.active {
      background: var(--bg-tertiary);
      color: var(--text-primary);
      border-color: var(--primary);
    }

    .sidebar-footer {
      border-top: 1px solid var(--border-color);
      padding-top: 16px;
    }

    .sidebar-footer-item {
      padding: 12px;
      color: var(--text-secondary);
      cursor: pointer;
      border-radius: 8px;
      font-size: 14px;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .sidebar-footer-item:hover {
      color: var(--text-primary);
      background: var(--bg-tertiary);
    }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: var(--bg-tertiary);
      border-radius: 6px;
      font-size: 12px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      animation: pulse 2s infinite;
    }

    .status-dot.offline {
      background: #ef4444;
      animation: none;
    }

    .status-dot.loading {
      background: #f59e0b;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .messages-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-secondary);
    }

    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    .empty-state-title {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .empty-state-subtitle {
      font-size: 14px;
      color: var(--text-secondary);
    }

    .message {
      display: flex;
      gap: 12px;
      animation: slideIn 0.3s ease;
    }

    .message.user {
      justify-content: flex-end;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message-avatar {
      font-size: 24px;
      flex-shrink: 0;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .message.user .message-avatar {
      order: 2;
    }

    .message-content {
      max-width: 70%;
      padding: 12px;
      border-radius: 8px;
      word-wrap: break-word;
    }

    .message.user .message-content {
      background: var(--primary);
      color: white;
    }

    .message.assistant .message-content {
      background: var(--bg-tertiary);
      color: var(--text-primary);
    }

    .message.error .message-content {
      background: #7f1d1d;
      color: #fecaca;
    }

    .typing-indicator {
      display: flex;
      gap: 4px;
      padding: 4px 8px;
    }

    .typing-indicator span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-secondary);
      animation: typing 1.4s infinite;
    }

    .typing-indicator span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .typing-indicator span:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes typing {
      0%, 60%, 100% { opacity: 0.3; transform: translateY(0); }
      30% { opacity: 1; transform: translateY(-10px); }
    }

    .input-area {
      padding: 16px;
      background: var(--bg-secondary);
      border-top: 1px solid var(--border-color);
    }

    .input-wrapper {
      display: flex;
      gap: 8px;
    }

    .input-field-container {
      flex: 1;
      display: flex;
      align-items: center;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 8px 12px;
      transition: border-color 0.2s;
    }

    .input-field-container:focus-within {
      border-color: var(--primary);
    }

    #messageInput {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-primary);
      outline: none;
      font-size: 14px;
    }

    #messageInput::placeholder {
      color: var(--text-secondary);
    }

    .input-actions {
      display: flex;
      gap: 4px;
    }

    .icon-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 16px;
      transition: color 0.2s;
      padding: 4px;
    }

    .icon-btn:hover {
      color: var(--text-primary);
    }

    .send-btn {
      padding: 8px 16px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s;
    }

    .send-btn:hover:not(:disabled) {
      background: var(--primary-dark);
    }

    .send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .params-panel {
      position: absolute;
      right: 0;
      top: 0;
      width: 300px;
      height: 100%;
      background: var(--bg-secondary);
      border-left: 1px solid var(--border-color);
      padding: 16px;
      overflow-y: auto;
      transform: translateX(100%);
      transition: transform 0.3s ease;
      z-index: 100;
    }

    .params-panel.open {
      transform: translateX(0);
    }

    .params-close {
      position: absolute;
      top: 16px;
      right: 16px;
      background: none;
      border: none;
      color: var(--text-primary);
      cursor: pointer;
      font-size: 20px;
    }

    .param-group {
      margin-top: 40px;
      margin-bottom: 24px;
    }

    .param-label {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 8px;
      text-transform: uppercase;
      font-weight: 600;
    }

    .param-group input,
    .param-group select {
      width: 100%;
      padding: 8px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-primary);
      font-size: 14px;
    }

    .param-group input:focus,
    .param-group select:focus {
      outline: none;
      border-color: var(--primary);
    }

    .param-value {
      font-size: 14px;
      margin-top: 4px;
      color: var(--text-primary);
      padding: 8px;
      background: var(--bg-tertiary);
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="sidebar">
      <div class="sidebar-header" onclick="app.newChat()" title="新对话">
        <span>💬</span>
        <span>NeurX Chat</span>
      </div>

      <button class="new-chat-btn" onclick="app.newChat()">+ 新对话</button>

      <div class="chat-history" id="chatHistory"></div>

      <div class="sidebar-footer">
        <div class="sidebar-footer-item" onclick="app.toggleParams()" title="参数设置">
          ⚙️ 参数设置
        </div>
        <div class="sidebar-footer-item" onclick="app.clearChat()" title="清空聊天">
          🗑️ 清空聊天
        </div>
      </div>
    </div>

    <div class="main-content">
      <div class="header">
        <h1 style="font-size: 18px;">NeurX AI 推理引擎</h1>
        <div class="status-indicator">
          <div class="status-dot" id="statusIndicator"></div>
          <span id="statusText">远端两节点 GPU 集群检查中...</span>
        </div>
      </div>

      <div class="messages-container" id="messagesContainer">
        <div class="empty-state">
          <div class="empty-state-icon">🤖</div>
          <div class="empty-state-title">NeurX AI助手</div>
          <div class="empty-state-subtitle">连接远端 GPU 后端: 192.168.10.39 + 192.168.10.75 两台组网推理</div>
        </div>
      </div>

      <div class="input-area">
        <div class="input-wrapper">
          <div class="input-field-container">
            <input
              type="text"
              id="messageInput"
              placeholder="输入消息或按 Shift + Enter 换行..."
            />
            <div class="input-actions">
              <button class="icon-btn" title="附件" onclick="alert('功能开发中')">📎</button>
            </div>
          </div>
          <button class="send-btn" id="sendBtn" onclick="app.sendMessage()" title="发送">➤</button>
        </div>
      </div>
    </div>

    <div class="params-panel" id="paramsPanel">
      <button class="params-close" onclick="app.toggleParams()">✕</button>

      <div class="param-group">
        <div class="param-label">推理服务器</div>
        <select id="serverSelect" onchange="app.state.server = this.value">
          <option value="auto">自动选择</option>
          <option value="Controller">Controller (192.168.10.39)</option>
          <option value="Worker">Worker (192.168.10.75)</option>
        </select>
      </div>

      <div class="param-group">
        <div class="param-label">模型选择</div>
        <select id="modelSelect" onchange="app.onModelChange(this.value)">
          <option value="qwen-0.5b">Qwen2.5-0.5B-Instruct (轻量级)</option>
          <option value="qwen-vl-7b">Qwen2.5-VL-7B (视觉-语言)</option>
        </select>
        <div style="font-size: 12px; color: var(--text-secondary); margin-top: 8px; padding: 8px; background: var(--bg-tertiary); border-radius: 4px;">
          <div id="modelStatus">当前模型: Qwen2.5-0.5B-Instruct</div>
        </div>
      </div>

      <div class="param-group">
        <div class="param-label">温度 (Temperature)</div>
        <input type="range" min="0" max="2" step="0.1" value="0.7" id="tempSlider" onchange="app.state.temperature = parseFloat(this.value); document.getElementById('tempValue').textContent = this.value">
        <div class="param-value" id="tempValue">0.7</div>
      </div>

      <div class="param-group">
        <div class="param-label">最大令牌数</div>
        <input type="number" min="1" max="4096" value="256" id="maxTokensInput" onchange="app.state.maxTokens = parseInt(this.value)">
      </div>

      <div class="param-group">
        <div class="param-label">Top P</div>
        <input type="range" min="0" max="1" step="0.05" value="0.9" id="topPSlider" onchange="app.state.topP = parseFloat(this.value); document.getElementById('topPValue').textContent = this.value">
        <div class="param-value" id="topPValue">0.9</div>
      </div>

      <div class="param-group">
        <div class="param-label">Top K</div>
        <input type="number" min="0" max="100" value="40" id="topKInput" onchange="app.state.topK = parseInt(this.value)">
      </div>
    </div>
  </div>

  <script>
    // 连接到本地 SSH 代理而不是直接连接到远端
    const API_BASE = window.NEURX_API_BASE || 'http://127.0.0.1:9000';
    console.log('API_BASE configured to:', API_BASE);

    window.app = {
      state: {
        messages: [],
        isLoading: false,
        backendStatus: 'checking',
        temperature: 0.7,
        maxTokens: 256,
        topP: 0.9,
        topK: 40,
        model: 'qwen-0.5b',  // 默认使用 Qwen2.5-0.5B-Instruct
        server: 'auto'  // 服务器选择: auto | Controller | Worker
      },

      async init() {
        console.log('Initializing app...');
        this.checkBackendStatus();
        setInterval(() => this.checkBackendStatus(), 5000);
        this.loadModelList();
        this.render();
        const input = document.getElementById('messageInput');
        if (input) {
          const self = this;
          input.addEventListener('keydown', function(e) {
            console.log('Key pressed:', e.key, 'shiftKey:', e.shiftKey);
            if (e.key === 'Enter' && !e.shiftKey) {
              e.preventDefault();
              console.log('Sending message...');
              self.sendMessage();
            }
          });
          input.focus();
          console.log('Message input initialized');
        } else {
          console.error('Message input element not found!');
        }
      },

      async loadModelList() {
        try {
          const response = await fetch(`${API_BASE}/api/models`, {
            method: 'GET',
            headers: { 'Content-Type': 'application/json' }
          });
          if (response.ok) {
            const data = await response.json();
            console.log('Available models:', data.models);
            // 更新模型状态显示
            const modelSelect = document.getElementById('modelSelect');
            const modelStatus = document.getElementById('modelStatus');
            if (modelSelect && modelStatus) {
              const selectedOption = modelSelect.options[modelSelect.selectedIndex];
              const selectedText = selectedOption ? selectedOption.text : 'Unknown';
              modelStatus.textContent = `当前模型: ${selectedText}`;
            }
          }
        } catch (e) {
          console.log('Could not load model list:', e);
        }
      },

      async checkBackendStatus() {
        try {
          const response = await fetch(`${API_BASE}/health`, {
            method: 'GET',
            headers: { 'Content-Type': 'application/json' }
          });
          if (response.ok) {
            this.state.backendStatus = 'online';
          } else {
            this.state.backendStatus = 'error';
          }
        } catch (e) {
          this.state.backendStatus = 'offline';
        }
        this.updateStatus();
      },

      updateStatus() {
        const indicator = document.getElementById('statusIndicator');
        const text = document.getElementById('statusText');
        const status = this.state.backendStatus;

        indicator.classList.remove('offline', 'loading');
        if (status === 'online') {
          text.textContent = '✓ 远端两节点 GPU 后端在线';
        } else if (status === 'offline') {
          indicator.classList.add('offline');
          text.textContent = '✗ 远端两节点 GPU 后端离线';
        } else {
          indicator.classList.add('loading');
          text.textContent = '检查远端两节点连接...';
        }
      },

      async sendMessage() {
        console.log('[sendMessage] Starting...');
        const input = document.getElementById('messageInput');
        const message = input.value.trim();
        console.log('[sendMessage] Message:', message);
        console.log('[sendMessage] isLoading:', this.state.isLoading);

        if (!message || this.state.isLoading) {
          console.log('[sendMessage] Blocked: empty message or already loading');
          return;
        }

        input.value = '';
        input.focus();

        this.state.messages.push({
          role: 'user',
          content: message
        });
        this.render();

        this.state.isLoading = true;
        this.state.messages.push({
          role: 'assistant',
          content: '...',
          loading: true
        });
        this.render();

        try {
          const url = `${API_BASE}/v1/chat/completions`;
          const payload = {
            model: this.state.model,
            messages: this.state.messages.filter(m => m.role !== 'error' && !m.loading),
            max_tokens: this.state.maxTokens,
            temperature: this.state.temperature,
            top_p: this.state.topP,
            top_k: this.state.topK,
            server: this.state.server  // 添加服务器选择参数
          };
          console.log('[sendMessage] POST to:', url);
          console.log('[sendMessage] Payload:', payload);

          const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          console.log('[sendMessage] Response status:', response.status);
          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }
          const data = await response.json();
          console.log('[sendMessage] Response data:', data);
          const assistantMessage = data.choices?.[0]?.message?.content || '抱歉，未能获得回复';

          this.state.messages[this.state.messages.length - 1] = {
            role: 'assistant',
            content: assistantMessage
          };
        } catch (error) {
          console.error('[sendMessage] Error:', error);
          this.state.messages[this.state.messages.length - 1] = {
            role: 'error',
            content: `❌ ${error.message || '发送失败，请检查后端连接'}`
          };
        } finally {
          this.state.isLoading = false;
          this.render();
        }
      },

      newChat() {
        if (confirm('要开始新对话吗？')) {
          this.state.messages = [];
          this.render();
        }
      },

      clearChat() {
        if (confirm('确定要清空所有聊天吗？')) {
          this.state.messages = [];
          this.render();
        }
      },

      toggleParams() {
        const panel = document.getElementById('paramsPanel');
        panel.classList.toggle('open');
      },

      onModelChange(modelId) {
        this.state.model = modelId;
        const modelSelect = document.getElementById('modelSelect');
        const modelStatus = document.getElementById('modelStatus');
        if (modelSelect && modelStatus) {
          const selectedOption = modelSelect.options[modelSelect.selectedIndex];
          const selectedText = selectedOption ? selectedOption.text : 'Unknown';
          modelStatus.textContent = `当前模型: ${selectedText}`;
          console.log(`[Model Changed] Now using: ${selectedText} (${modelId})`);
        }
      },

      render() {
        const container = document.getElementById('messagesContainer');
        if (!container) return;

        if (this.state.messages.length === 0) {
          container.innerHTML = `
            <div class="empty-state">
              <div class="empty-state-icon">🤖</div>
              <div class="empty-state-title">NeurX AI助手</div>
              <div class="empty-state-subtitle">连接远端 GPU 后端: 192.168.10.39 + 192.168.10.75 两台组网推理</div>
            </div>
          `;
        } else {
          container.innerHTML = this.state.messages.map(msg => {
            if (msg.loading) {
              return `
                <div class="message loading">
                  <div class="message-avatar">🤖</div>
                  <div class="message-content">
                    <div class="typing-indicator">
                      <span></span>
                      <span></span>
                      <span></span>
                    </div>
                  </div>
                </div>
              `;
            }
            return `
              <div class="message ${msg.role}">
                <div class="message-avatar">${msg.role === 'user' ? '👤' : msg.role === 'error' ? '❌' : '🤖'}</div>
                <div class="message-content">${msg.content}</div>
              </div>
            `;
          }).join('');

          container.scrollTop = container.scrollHeight;
        }

        const sendBtn = document.getElementById('sendBtn');
        const input = document.getElementById('messageInput');
        if (sendBtn) {
          sendBtn.disabled = this.state.isLoading || !input?.value.trim();
        }
      }
    };

    app.init();
  </script>
</body>
</html>
