version: '3.8'

services:
  neurx-cpu:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    image: neurx:latest
    container_name: neurx-inference-cpu
    
    network_mode: host
    
    environment:
      NEURX_MODEL_DIR: /models/default
      NEURX_INFER_DEVICE: cpu
      NEURX_S_PORT: 8000
      NEURX_S_HOST: 0.0.0.0
      NEURX_CPU_THREADS: 4
      NEURX_CHAT_MAX_NEW_TOKENS: 512
    
    volumes:
      - /model/Qwen2.5-0.5B-Instruct:/models/default
      - ./logs:/logs
      - ./data:/data
    
    stdin_open: false
    tty: false
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    restart: unless-stopped
    
    command: start

  neurx-gpu:
    build:
      context: .
      dockerfile: Dockerfile
    image: neurx:latest-gpu
    container_name: neurx-inference-gpu
    
    runtime: nvidia
    network_mode: host
    
    environment:
      NEURX_MODEL_DIR: /models/default
      NEURX_INFER_DEVICE: gpu
      NEURX_S_PORT: 8000
      NEURX_S_HOST: 0.0.0.0
      NEURX_CHAT_MAX_NEW_TOKENS: 512
      NVIDIA_VISIBLE_DEVICES: all
    
    volumes:
      - /model/Qwen2.5-0.5B-Instruct:/models/default
      - ./logs:/logs
      - ./data:/data
    
    stdin_open: false
    tty: false
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    restart: unless-stopped
    
    command: start
    
    profiles:
      - gpu

  neurx-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: neurx:latest
    container_name: neurx-api-server
    
    network_mode: host
    
    environment:
      NEURX_MODEL_DIR: /models/default
      NEURX_INFER_DEVICE: cpu
      NEURX_S_PORT: 8000
      NEURX_S_HOST: 0.0.0.0
      NEURX_CPU_THREADS: 8
      NEURX_CHAT_MAX_NEW_TOKENS: 2048
    
    volumes:
      - /model/Qwen2.5-0.5B-Instruct:/models/default
      - ./logs:/logs
      - ./data:/data
    
    stdin_open: false
    tty: false
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    restart: unless-stopped
    
    command: api
    
    profiles:
      - api

  neurx-download:
    build:
      context: .
      dockerfile: Dockerfile
    image: neurx:latest
    container_name: neurx-download-models
    
    environment:
      NEURX_MODEL_DIR: /models/default
    
    volumes:
      - /model/Qwen2.5-0.5B-Instruct:/models/default
      - ./logs:/logs
    
    entrypoint: ["/entrypoint.sh"]
    command: ["download-model", "Qwen/Qwen2.5-0.5B-Instruct"]
    
    profiles:
      - download


