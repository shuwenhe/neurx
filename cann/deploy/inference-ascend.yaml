apiVersion: apps/v1
kind: Deployment
metadata: {name: neurx-inference-ascend, labels: {app: neurx-inference, backend: ascend}}
spec:
  replicas: 8
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 1, maxSurge: 0}}
  selector: {matchLabels: {app: neurx-inference, backend: ascend}}
  template:
    metadata:
      labels: {app: neurx-inference, backend: ascend}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "8080", prometheus.io/path: "/metrics"}
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: neurx
          image: neurx/inference-ascend:latest
          ports: [{name: http, containerPort: 8080}, {name: grpc, containerPort: 8081}]
          env:
            - {name: NEURX_BACKEND, value: ascend}
            - {name: NEURX_ASCEND_DEVICE_ID, value: "0"}
            - {name: NEURX_ASCEND_PRECISION, value: int8}
            - {name: NEURX_CHECKPOINT, value: /models/transformer_v2.ckpt}
            - {name: NEURX_CANN_OPERATOR_LIBRARY, value: /app/neurx/lib/libneurx_cann_operators.so}
            - {name: NEURX_DRAIN_TIMEOUT_MS, value: "110000"}
          readinessProbe: {httpGet: {path: /health/ready, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health/live, port: http}, periodSeconds: 10}
          lifecycle: {preStop: {httpGet: {path: /admin/drain, port: http}}}
          resources:
            requests: {cpu: "4", memory: 16Gi, huawei.com/Ascend310P: "1"}
            limits: {cpu: "16", memory: 64Gi, huawei.com/Ascend310P: "1"}
          volumeMounts:
            - {name: model, mountPath: /models, readOnly: true}
      volumes:
        - name: model
          persistentVolumeClaim: {claimName: neurx-model}
---
apiVersion: v1
kind: Service
metadata: {name: neurx-inference-ascend}
spec:
  selector: {app: neurx-inference, backend: ascend}
  ports:
    - {name: http, port: 8080, targetPort: http}
    - {name: grpc, port: 8081, targetPort: grpc}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: neurx-inference-ascend}
spec: {minAvailable: 7, selector: {matchLabels: {app: neurx-inference, backend: ascend}}}
