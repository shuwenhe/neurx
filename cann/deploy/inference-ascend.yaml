apiVersion: apps/v1
kind: Deployment
metadata: {name: neurx-inference-ascend, labels: {app: neurx-inference, backend: ascend}}
spec:
  replicas: 8
  strategy: {type: RollingUpdate, rolling_update: {max_unavailable: 1, max_surge: 0}}
  selector: {match_labels: {app: neurx-inference, backend: ascend}}
  template:
    metadata:
      labels: {app: neurx-inference, backend: ascend}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "8080", prometheus.io/path: "/metrics"}
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: neurx
          image: neurx/inference-ascend:latest
          ports: [{name: http, container_port: 8080}, {name: grpc, container_port: 8081}]
          env:
            - {name: NEURX_BACKEND, value: ascend}
            - {name: NEURX_ASCEND_DEVICE_ID, value: "0"}
            - {name: NEURX_ASCEND_PRECISION, value: int8}
            - {name: NEURX_ASCEND_HTTP_MAX_BATCH, value: "64"}
            - {name: NEURX_CHECKPOINT, value: /models/transformer_v2.ckpt}
            - {name: NEURX_CANN_OPERATOR_LIBRARY, value: /app/neurx/lib/libneurx_cann_operators.so}
            - {name: NEURX_DRAIN_TIMEOUT_MS, value: "110000"}
          readiness_probe: {http_get: {path: /health/ready, port: http}, period_seconds: 5}
          liveness_probe: {http_get: {path: /health/live, port: http}, period_seconds: 10}
          lifecycle: {pre_stop: {http_get: {path: /admin/drain, port: http}}}
          resources:
            requests: {cpu: "4", memory: 16gi, huawei.com/ascend_310_p: "1"}
            limits: {cpu: "16", memory: 64gi, huawei.com/ascend_310_p: "1"}
          volume_mounts:
            - {name: model, mount_path: /models, read_only: true}
      volumes:
        - name: model
          persistent_volume_claim: {claim_name: neurx-model}
---
api_version: v1
kind: Service
metadata: {name: neurx-inference-ascend}
spec:
  selector: {app: neurx-inference, backend: ascend}
  ports:
    - {name: http, port: 8080, target_port: http}
    - {name: grpc, port: 8081, target_port: grpc}
---
api_version: policy/v1
kind: PodDisruptionBudget
metadata: {name: neurx-inference-ascend}
spec: {min_available: 7, selector: {match_labels: {app: neurx-inference, backend: ascend}}}
