model:
  name: NeurX-1.3.neurx
  vocab_size: 50257
  hidden_dim: 4096
  num_layers: 32
  max_seq_len: 2048
training:
  batch_size: 16
  learning_rate: 0.00028
  weight_decay: 0.0001
  num_epochs: 8
  warmup_steps: 80
optimization:
  mixed_precision: true
  gradient_checkpointing: true
  grad_clip_norm: 1.0
data:
  train_path: data/train.txt
  eval_path: data/eval.txt
  checkpoint_dir: checkpoint/neur_x-1.3/
distributed:
  world_size: 1
  backend: nccl
