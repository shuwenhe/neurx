# Reference-only preset inspired by modern GPT-style dense pretraining.
# This is NOT an official OpenAI GPT-5.5 architecture or hyperparameter dump.
dataset_manifest: "data/pretrain/mini_manifest.json"
output_dir: "artifacts/checkpoints/gpt55_reference_run"
checkpoint_root: "artifacts/checkpoints/gpt55_reference_run"

# Training loop
micro_batch_size: 4
seq_len: 4096
max_steps: 20000
lr: 0.00012
min_lr: 0.000012
warmup_steps: 2000
weight_decay: 0.1
log_interval: 10
eval_interval: 200
save_interval: 500
backend: "cuda"

# Distributed layout
tensor_parallel_degree: 8
pipeline_parallel_degree: 4
data_parallel_degree: 8
sequence_parallel_degree: 1
zero_stage: 3

# Model shape
hidden_dim: 6144
num_layers: 48
num_attention_heads: 48
num_kv_heads: 8
intermediate_dim: 24576
vocab_size: 131072
